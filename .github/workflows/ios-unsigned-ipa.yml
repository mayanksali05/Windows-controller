# Builds the WinLock iPhone app as an UNSIGNED .ipa on a GitHub-hosted Mac,
# so it can be installed from Windows with Sideloadly and a free Apple ID.
# See docs/iphone-install-windows.md.
#
# Run it: GitHub -> Actions -> "iOS unsigned IPA" -> Run workflow.
# Download: open the finished run -> Artifacts -> WinLock-unsigned-ipa.
name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iphone/**'
      - '.github/workflows/ios-unsigned-ipa.yml'

concurrency:
  group: ios-unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: iphone

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: iphone/package-lock.json

      - name: Install JS dependencies
        run: npm ci

      - name: Type-check and unit tests
        run: |
          npx tsc --noEmit
          npx jest --ci

      - name: Generate the native iOS project (expo prebuild + pods)
        run: npx expo prebuild --platform ios --clean

      - name: Build Release for device without code signing
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 200

      - name: Package .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -n 1)
          echo "App bundle: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry WinLock-unsigned.ipa Payload
          ls -lh WinLock-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: WinLock-unsigned-ipa
          path: iphone/WinLock-unsigned.ipa
          retention-days: 30
