# Builds the WinLock credential provider DLL (needed for iPhone unlock) on a
# GitHub-hosted Windows machine, so you don't need Visual Studio locally.
# See docs/windows-unlock.md.
#
# Run it: GitHub -> Actions -> "Windows credential provider" -> Run workflow.
# Download: open the finished run -> Artifacts -> WinLock-CredentialProvider.
# Install (elevated PowerShell, from the repo folder):
#   .\scripts\install-credential-provider.ps1 -DllPath <path to downloaded DLL>
name: Windows credential provider

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows/WinLock.CredentialProvider/**'
      - 'scripts/build-credential-provider.ps1'
      - '.github/workflows/windows-credential-provider.yml'

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build (MSVC, Release x64)
        shell: pwsh
        run: .\scripts\build-credential-provider.ps1 -Configuration Release

      - name: Show exports and SHA-256
        shell: pwsh
        run: |
          $dll = 'windows\WinLock.CredentialProvider\bin\Release\WinLock.CredentialProvider.dll'
          Get-FileHash $dll -Algorithm SHA256 | Format-List
          $dumpbin = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -find 'VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe' | Select-Object -First 1
          if ($dumpbin) { & $dumpbin /nologo /exports $dll }

      - uses: actions/upload-artifact@v4
        with:
          name: WinLock-CredentialProvider
          path: |
            windows/WinLock.CredentialProvider/bin/Release/WinLock.CredentialProvider.dll
            windows/WinLock.CredentialProvider/bin/Release/WinLock.CredentialProvider.pdb
          retention-days: 30
