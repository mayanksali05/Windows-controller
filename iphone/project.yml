name: WinLock
options:
  bundleIdPrefix: com.winlock
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  WinLock:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WinLock
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.winlock.app
        PRODUCT_NAME: WinLock
        INFOPLIST_FILE: WinLock/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: WinLock/WinLock.entitlements
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO